# Cloudflare Workers + OpenNext (SSR, middleware, API routes).
# Deploy: npm run deploy (ou Workers Builds que use este wrangler.toml)
# Não coloque secrets aqui (service role, Stripe secret, webhook, cron) — só no painel Cloudflare.

name = "corte-pro"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

main = ".open-next/worker.js"

# NEXT_PUBLIC_* e price id: disponíveis no Worker e durante `wrangler`/`opennextjs-cloudflare` (build incluso).
[vars]
NEXT_PUBLIC_SUPABASE_URL = "${NEXT_PUBLIC_SUPABASE_URL}"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
NEXT_PUBLIC_APP_URL = "${NEXT_PUBLIC_APP_URL}"
STRIPE_PRICE_ID = "${STRIPE_PRICE_ID}"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
