# Cloudflare Workers + OpenNext (SSR, middleware, API routes).
# Deploy: npm run deploy (ou Workers Builds que use este wrangler.toml)
# Não coloque secrets aqui (service role, Stripe secret, webhook, cron) — só no painel Cloudflare.

name = "corte-pro"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
